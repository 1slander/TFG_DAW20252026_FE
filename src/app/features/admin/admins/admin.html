<div class="admin-main-container" [class.is-mobile]="screenSize.isMobile()">

  <div class="admin-header">
    <h2 class="admin-title">Lista de Administradores</h2>

    <mat-form-field appearance="outline" class="no-subscript search-field">
      <mat-label>Buscar por nombre o email</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej: Carlos" #input>
    </mat-form-field>
  </div>

  <mat-accordion>
    <mat-expansion-panel [expanded]="showCreateForm" (expandedChange)="showCreateForm = $event">
      <mat-expansion-panel-header>
        <mat-panel-title class="panel-title">
          <mat-icon>add</mat-icon>
          Añadir nuevo admin
        </mat-panel-title>
      </mat-expansion-panel-header>

      <app-dynamic-form [fields]="adminFields" (formSubmit)="onCreateAdmin($event)"></app-dynamic-form>
    </mat-expansion-panel>
  </mat-accordion>

  <div class="table-wrapper">
    <table mat-table [dataSource]="admins()" [trackBy]="trackById">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Identificador</th>
        <td mat-cell *matCellDef="let admin">{{ admin.id }}</td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let admin">{{ admin.username }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let admin">{{ admin.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let admin">
          <span [class]="admin.role.toLowerCase()">{{ admin.role }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let admin">
          <!-- <button mat-icon-button (click)="viewAdmin(admin.id)">
            <mat-icon>visibility</mat-icon>
          </button> -->
          <button mat-icon-button (click)="deleteAdmin(admin.id)" class="delete-icon">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
