<div class="container responsive-grid">
  @for (mod of modules; track mod.title) {
    <mat-card class="example-card" appearance="outlined" [routerLink]="mod.route()">
      <mat-card-header>
        <mat-card-title>{{ mod.title }}</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <p>{{ mod.description }}</p>
      </mat-card-content>

      <mat-card-footer class="example-card-footer">
        <mat-chip-set aria-label="Chihuahua traits">
          @for (trait of mod.traits; track trait) {
            <mat-chip>{{ trait }}</mat-chip>
          }
        </mat-chip-set>
      </mat-card-footer>
    </mat-card>
  }

  @if (modules.length === 0) {
    <p style="grid-column: 1 / -1; margin: 0;">
      No hay módulos disponibles para este perfil.
    </p>
  }
</div>
