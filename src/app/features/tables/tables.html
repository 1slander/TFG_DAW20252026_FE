<div class="table-wrapper">
  <table mat-table [dataSource]="tableList()">
    <!-- <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Identificador</th>
        <td mat-cell *matCellDef="let admin">{{ admin.id }}</td>
      </ng-container> -->

    <ng-container matColumnDef="tableNumber">
      <th mat-header-cell *matHeaderCellDef>Numero</th>
      <td mat-cell *matCellDef="let table">{{ table.tableNumber }}</td>
    </ng-container>
    <ng-container matColumnDef="tableCapacity">
      <th mat-header-cell *matHeaderCellDef>Capacidad</th>
      <td mat-cell *matCellDef="let table">{{ table.tableCapacity }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let table">{{ table.status }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let table">
        <!-- <button mat-icon-button (click)="viewemployee(employee.id)">
            <mat-icon>visibility</mat-icon>
          </button> -->
        <button mat-icon-button (click)="deleteTable(table.idTable)" class="delete-icon">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
