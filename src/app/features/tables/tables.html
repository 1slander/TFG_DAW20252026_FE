<mat-sidenav-container class="users-sidenav-container" [class.is-mobile]="screenSize.isMobile()">
  <mat-sidenav-content>
    <div class="users-header">
      <h2>{{ restaurantName() }}</h2>
    </div>
    <div class="tables-grid">
      <div
        class="table-card mat-elevation-z3"
        *ngFor="let table of tableList()"
        [ngClass]="[table.status.toLowerCase(), 'capacity-' + table.tableCapacity]"
      >
        <div class="table-visual">
          <div class="table-number">Mesa {{ table.tableNumber }}</div>
          <div class="table-capacity">{{ table.tableCapacity }} personas</div>
        </div>

        <div class="table-status">
          {{ table.status }}
        </div>

        <div class="table-actions">
          <button
            mat-mini-fab
            class="status-btn disponible"
            (click)="updateStatus(table.idTable, 'NOT_BOOKED')"
            [disabled]="table.status === 'NOT_BOOKED'"
            matTooltip="Disponible"
          >
            <mat-icon>event_seat</mat-icon>
          </button>

          <button
            mat-mini-fab
            class="status-btn reservado"
            (click)="updateStatus(table.idTable, 'BOOKED')"
            [disabled]="table.status === 'BOOKED'"
            matTooltip="Reservar"
          >
            <mat-icon>bookmark</mat-icon>
          </button>

          <button
            mat-mini-fab
            class="status-btn ocupado"
            (click)="updateStatus(table.idTable, 'CONFIRMED')"
            [disabled]="table.status === 'CONFIRMED'"
            matTooltip="Confirmada / Ocupada"
          >
            <mat-icon>restaurant</mat-icon>
          </button>

          <button
            mat-mini-fab
            class="status-btn pendiente"
            (click)="updateStatus(table.idTable, 'PENDING')"
            [disabled]="table.status === 'PENDING'"
            matTooltip="Pendiente"
          >
            <mat-icon>schedule</mat-icon>
          </button>

          <button
            mat-mini-fab
            color="warn"
            (click)="deleteTable(table.idTable)"
            matTooltip="Eliminar mesa"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
