<mat-toolbar>
  <button
    matIconButton
    class="example-icon"
    aria-label="Example icon-button with menu icon"
    matTooltip="Menu"
    matTooltipPosition="below"
    (click)="drawer.toggle()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ area === 'admin' ? 'Admin Dashboard' : 'User Dashboard' }}</span>
  <span class="example-spacer"></span>

  <app-theme-selector/>
  <app-settings-menu />
</mat-toolbar>

<mat-drawer-container class="example-container">
  <mat-drawer
    #drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    position="start"
  >
    <app-sidebar-menu [isMobile]="isMobile()" [area]="area" (itemClicked)="onNavigate()" />
  </mat-drawer>
  <mat-drawer-content style="padding: 5px">
    <router-outlet />
  </mat-drawer-content>
</mat-drawer-container>
