<mat-sidenav-container class="users-sidenav-container" [class.is-mobile]="screenSize.isMobile()">
  <mat-sidenav position="end" mode="over" [opened]="sidenavOpen" (closedStart)="closeSidenav()">
    <app-employee-detail-sidenav
      [employee]="selectedEmployee"
      [opened]="sidenavOpen"
      (close)="closeSidenav()"
      (toggleActive)="onToggleActive($event)"
    ></app-employee-detail-sidenav>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="users-header">
      <h2>Lista de Usuarios</h2>

      <app-search-box
        label="Buscar por nombre o email"
        placeholder="Ej: Carlos"
        (valueChange)="applyFilter($event)"
      >
      </app-search-box>
    </div>


    <app-create-panel 
      title="Añadir nuevo usuario"
      [expanded]="showCreateForm">
        <app-dynamic-form
          [fields]="employeeFields"
          (formSubmit)="onCreateOwner($event)"
        ></app-dynamic-form>
    </app-create-panel>

    <div class="table-wrapper">
      <table mat-table [dataSource]="employees()">
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
          <td mat-cell *matCellDef="let employee">
            {{ employee.firstName }} {{ employee.lastName }}
          </td>
        </ng-container>

        @if (!screenSize.isMobile()) {
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let employee">{{ employee.email }}</td>
          </ng-container>
        }

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let employee">{{ employee.role.roleName }}</td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let employee">
            {{ employee.isActive ? 'Activo' : 'Inactivo' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Detalle</th>
          <td mat-cell *matCellDef="let employee">
            <button mat-icon-button (click)="openSidenav(employee)">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns()"
          [class.inactive-row]="!row.isActive"
        ></tr>
      </table>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
