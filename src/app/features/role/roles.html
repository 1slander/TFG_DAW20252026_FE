<div class="admin-main-container" [class.is-mobile]="screenSize.isMobile()">

  <div class="admin-header">
    <h2 class="admin-title">Gestión de Roles</h2>

  </div>

  <!-- <app-create-panel title="Añadir nuevo rol" [expanded]="showCreateForm">
    <app-dynamic-form [fields]="roleFields" (formSubmit)="onCreateRole($event)"></app-dynamic-form>
  </app-create-panel> -->

  <div class="table-wrapper">
    <table mat-table [dataSource]="roles()" [trackBy]="trackById">

      <ng-container matColumnDef="roleName">
        <th mat-header-cell *matHeaderCellDef>Identificador</th>
        <td mat-cell *matCellDef="let role">{{ role.roleName }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let role">
          <!-- <button mat-icon-button (click)="deleteRole(role.idRole)" class="delete-icon">
            <mat-icon>delete</mat-icon>
          </button> -->
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
