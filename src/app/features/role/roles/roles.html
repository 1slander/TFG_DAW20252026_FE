<div class="admin-main-container" [class.is-mobile]="screenSize.isMobile()">

  <div class="admin-header">
    <h2 class="admin-title">Gestión de Roles</h2>

    <mat-form-field appearance="outline" class="no-subscript" style="width: 220px;">
      <mat-label>Filtrar por Nivel</mat-label>
      <mat-select [value]="selectedCategory()" (selectionChange)="onCategoryChange($event.value)">
        <mat-option value="ALL">--- TODOS ---</mat-option>
        <mat-option value="ADMIN">ADMIN</mat-option>
        <mat-option value="OWNER">OWNER</mat-option>
        <mat-option value="EMPLOYEE">EMPLOYEE</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-accordion>
    <mat-expansion-panel [expanded]="showCreateForm" (expandedChange)="showCreateForm = $event">
      <mat-expansion-panel-header>
        <mat-panel-title class="panel-title">
          <mat-icon>add</mat-icon> Añadir nuevo rol
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-dynamic-form [fields]="roleFields" (formSubmit)="onCreateRole($event)"></app-dynamic-form>
    </mat-expansion-panel>
  </mat-accordion>

  <div class="table-wrapper">
    <table mat-table [dataSource]="roles()" [trackBy]="trackById">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let role">{{ role.id }}</td>
      </ng-container>

      <ng-container matColumnDef="roleName">
        <th mat-header-cell *matHeaderCellDef>Identificador</th>
        <td mat-cell *matCellDef="let role">{{ role.roleName }}</td>
      </ng-container>

      <ng-container matColumnDef="roleCategory">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let role">
          <span [class]="role.roleCategory.toLowerCase()">{{ role.roleCategory }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let role">
          <button mat-icon-button (click)="deleteRole(role.id)" class="delete-icon">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
