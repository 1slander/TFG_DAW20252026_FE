<mat-nav-list>
  <mat-list-item routerLink="home" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">home</mat-icon>
      Home
    </span>
  </mat-list-item>

  @if (userRole === 'ADMIN') {
  <mat-list-item routerLink="admin" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">admin_panel_settings</mat-icon>
      Administradores
    </span>
  </mat-list-item>

  <mat-list-item routerLink="role" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">badge</mat-icon>
      Roles
    </span>
  </mat-list-item>

  <mat-list-item routerLink="user" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">people</mat-icon>
      Usuarios
    </span>
  </mat-list-item>
  }

  @if (userRole === 'OWNER') {
  <mat-list-item routerLink="restaurant" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">restaurant</mat-icon>
      Restaurantes
    </span>
  </mat-list-item>
  }

  @if (userRole === 'OWNER' || userRole === 'EMPLOYEE') {
  <mat-list-item routerLink="shift" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">schedule</mat-icon>
      Turnos
    </span>
  </mat-list-item>
  }

  @if (userRole === 'OWNER') {
  <mat-list-item routerLink="employee" routerLinkActive="activelink" (click)="handleItemClick()" tabindex="-1">
    <span class="icon-and-text">
      <mat-icon class="icon-margin">badge</mat-icon>
      Empleados
    </span>
  </mat-list-item>
  }
</mat-nav-list>
